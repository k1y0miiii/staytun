name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check src tests scripts

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run --with pytest pytest -q
      - name: пакет собирается и запускается
        run: |
          uv build -o dist
          uvx --from dist/*.whl staytun --version
          uvx --from dist/*.whl staytun config

  rules-pf:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: PYTHONPATH=src uv run --no-project python scripts/render_sample.py /tmp/staytun en0
      - name: pfctl принимает правила (только проверка, без загрузки)
        run: sudo pfctl -nvf /tmp/staytun/pf.conf | tail -20

  rules-nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - run: PYTHONPATH=src uv run --no-project python scripts/render_sample.py /tmp/staytun eth0
      - name: nft принимает правила (только проверка, без загрузки)
        run: sudo nft -c -f /tmp/staytun/staytun.nft
